name: Deploy to Cloudflare Pages

# lab.bkan.dev 배포. main 에 push 되면 Next.js 정적 내보내기(out/)를 올리고 라이브를 검증한다.
# 랜딩·분야 목록은 app/ 에서 만들고, 기존 실험과 자산은 public/ 에서 그대로 복사된다.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # 앱 파일을 바꾸고 ?v=·VERSION을 안 올리거나 같은 이름 사진을 고치면 라이브 캐시 때문에 옛 파일이 계속 보인다
      - name: Check top-cross cache busting
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD~1
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" && base="$BEFORE"
          fi
          python3 tools/topx_cache_check.py "$base" HEAD

      # pnpm 버전은 package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist (Next.js 정적 내보내기)
        run: |
          pnpm build
          rsync -a --delete out/ /tmp/dist/
          test -f /tmp/dist/index.html
          test -f /tmp/dist/404.html
          # trailingSlash가 만드는 /404/, /_not-found/는 200으로 열리는 가짜 404 주소라 build 스크립트가 지운다
          test ! -e /tmp/dist/404
          test ! -e /tmp/dist/_not-found
          test -f /tmp/dist/frontend/index.html
          test -f /tmp/dist/motion/index.html
          test -f /tmp/dist/frontend/ganghwa-2610/index.html
          test -f /tmp/dist/_headers
          test -f /tmp/dist/_routes.json
          test ! -e /tmp/dist/README.md
          test ! -e /tmp/dist/CLAUDE.md
          echo "dist files: $(find /tmp/dist -type f | wc -l)"

      # lab.bkan.dev는 DNS only라 Cloudflare가 Web Analytics beacon을 자동으로 넣지 못한다. 올릴 페이지마다 한 개씩 있는지 본다
      - name: Check web analytics beacon
        run: python3 tools/beacon_check.py /tmp/dist

      # functions/_middleware.js 가 mp4 Range(206)를 만들 때 쓰는 크기 목록. 실제로 올릴 파일에서 잰다
      - name: Build video size list (Range용)
        run: python3 tools/video_sizes.py /tmp/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/dist --project-name=bkan-lab --branch=main --commit-dirty=true

      # 본문 검증은 pages.dev 프로덕션 별칭에 한다. bkan.dev 존의 봇 방어가 GitHub 러너의
      # HTML 요청을 403 challenge 로 막기 때문이다(bkan-blog 런에서 실측). 커스텀 도메인은
      # challenge 를 안 받는 정적 자산으로만 본다.
      - name: Verify live site
        run: |
          SITE=https://bkan-lab.pages.dev
          CUSTOM=https://lab.bkan.dev
          run_checks() {
            home=$(curl -s -L -H 'Cache-Control: no-cache' "$SITE/")
            fe=$(curl -s -L -H 'Cache-Control: no-cache' "$SITE/frontend/")
            gh_og=$(curl -s -L "$SITE/frontend/ganghwa-2610/" | head -c 20000)
            hj_og=$(curl -s -L "$SITE/frontend/hwajeong-2612/" | head -c 20000)
            hj_data=$(curl -s -L -o /dev/null -w '%{http_code} %{content_type}' "$SITE/frontend/hwajeong-2612/data.json")
            tc_og=$(curl -s -L "$SITE/frontend/top-cross/" | head -c 20000)
            tc_data=$(curl -s -L -o /dev/null -w '%{http_code} %{content_type}' "$SITE/frontend/top-cross/data.json")
            gp_og=$(curl -s -L "$SITE/frontend/goyang-paju-mind-2610/" | head -c 20000)
            gp_data=$(curl -s -L -o /dev/null -w '%{http_code} %{content_type}' "$SITE/frontend/goyang-paju-mind-2610/data.json")
            missing=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/no-such-page-$(date +%s)/")
            custom_css=$(curl -s -L -o /dev/null -w '%{http_code} %{content_type}' "$CUSTOM/assets/lab.css")
            beacon=$(printf '%s' "$home" | sed 's/&quot;/"/g' | grep -oE "data-cf-beacon=['\"]\{\"token\": \"ae655c6ae08e401ea37ed39f25af4d6e\"\}['\"]" | wc -l | tr -d ' ')
            custom_range=$(curl -s -r 1000-1999 -o /dev/null -w '%{http_code} %{size_download}' "$CUSTOM/motion/idala-demo/v/hf.mp4")
            fail=0
            check() { if [ "$2" = "1" ]; then echo "PASS  $1"; else echo "FAIL  $1"; fail=1; fi; }
            check "home renders landing (bkan lab + /frontend/ link)" \
                  "$(printf '%s' "$home" | grep -qF 'href="/frontend/"' && echo 1 || echo 0)"
            check "frontend lists ganghwa" \
                  "$(printf '%s' "$fe" | grep -qF 'href="/frontend/ganghwa-2610/"' && echo 1 || echo 0)"
            check "ganghwa page has og:image" \
                  "$(printf '%s' "$gh_og" | grep -qF 'og:image" content="https://lab.bkan.dev/frontend/ganghwa-2610/og.jpg' && echo 1 || echo 0)"
            check "frontend lists hwajeong" \
                  "$(printf '%s' "$fe" | grep -qF 'href="/frontend/hwajeong-2612/"' && echo 1 || echo 0)"
            check "hwajeong page has og:image" \
                  "$(printf '%s' "$hj_og" | grep -qF 'og:image" content="https://lab.bkan.dev/frontend/hwajeong-2612/og.jpg' && echo 1 || echo 0)"
            check "hwajeong data.json served as json" \
                  "$(printf '%s' "$hj_data" | grep -q '^200 application/json' && echo 1 || echo 0)"
            check "frontend lists top-cross" \
                  "$(printf '%s' "$fe" | grep -qF 'href="/frontend/top-cross/"' && echo 1 || echo 0)"
            check "top-cross page has og:image" \
                  "$(printf '%s' "$tc_og" | grep -qF 'og:image" content="https://lab.bkan.dev/frontend/top-cross/og.jpg' && echo 1 || echo 0)"
            check "top-cross data.json served as json" \
                  "$(printf '%s' "$tc_data" | grep -q '^200 application/json' && echo 1 || echo 0)"
            check "frontend lists goyang-paju-mind" \
                  "$(printf '%s' "$fe" | grep -qF 'href="/frontend/goyang-paju-mind-2610/"' && echo 1 || echo 0)"
            check "goyang-paju-mind page has og:image" \
                  "$(printf '%s' "$gp_og" | grep -qF 'og:image" content="https://lab.bkan.dev/frontend/goyang-paju-mind-2610/og.jpg' && echo 1 || echo 0)"
            check "goyang-paju-mind data.json served as json" \
                  "$(printf '%s' "$gp_data" | grep -q '^200 application/json' && echo 1 || echo 0)"
            # 대시보드 Web Analytics의 lab.bkan.dev 사이트 토큰. 바뀌면 app/layout.tsx, public/의 HTML과 같이 고친다
            # (랜딩은 Next.js가 만들어 속성 안 따옴표가 &quot;로 나온다. beacon_check.py처럼 따옴표를 푼 뒤 비교한다)
            check "home has web analytics beacon (lab.bkan.dev token)" "$([ "$beacon" = "1" ] && echo 1 || echo 0)"
            check "unknown path returns 404" "$([ "$missing" = "404" ] && echo 1 || echo 0)"
            check "custom domain reachable (lab.bkan.dev/assets/lab.css)" \
                  "$(printf '%s' "$custom_css" | grep -q '^200 text/css' && echo 1 || echo 0)"
            # Range가 없으면 Chrome에서 영상 장면 점프·재생 막대가 동작하지 않는다(functions/_middleware.js)
            check "custom domain video Range 206 (idala hf.mp4)" \
                  "$([ "$custom_range" = "206 1000" ] && echo 1 || echo 0)"
            return $fail
          }
          for attempt in 1 2 3; do
            echo "--- attempt $attempt"
            if run_checks; then exit 0; fi
            sleep 10
          done
          exit 1
