  }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  // ---------- 거리 ----------
  function hav(a, b) {

  function kmOf(d) { return S.from === "me" && me ? hav(me, d) : d.km[S.from]; }

  // ---------- 조각 ----------

  function chips(d) {

      '<span class="c-ev">' + esc(d.evidence) + "</span>" + chips(d) + "</span></button></li>";

    h += row("근거 등급", '<p class="grade-rule">' + esc(d.grade_text) + "</p>" + gp.map(function (p) {
      return '<div class="gp"><a href="' + (p.pmid ? "https://pubmed.ncbi.nlm.nih.gov/" + esc(p.pmid) + "/" : safe("https://doi.org/" + p.doi)) + '" target="_blank" rel="noopener noreferrer">' + esc(p.title) + "</a><span>" + esc(p.year + " · " + p.journal + " · " + (KIND[p.kind] || p.kind) + " · " + (ROLE[p.role] || p.role)) + "</span></div>";
    }).join("") + (gs.more ? '<p class="grade-rule" style="margin-top:.5rem">외 ' + gs.more + "편</p>" : ""));
    if (d.limits) h += row("평가의 한계", "<p>" + esc(d.limits) + "</p>");
    h += row("진료 상태", "<p>" + esc(d.status) + (d.status_note ? " · " + esc(d.status_note) : "") + "</p><p class=\"grade-rule\" style=\"margin-top:.3rem\">확인일 " + esc(d.checked) + "</p>");
    h += row("출처", '<div class="links">' + d.sources.map(function (u, i) { return '<a href="' + safe(u) + '" target="_blank" rel="noopener noreferrer">' + esc(u.replace(/^https?:\/\//, "").split("/")[0]) + " ↗</a>"; }).join("") + "</div>");
    return h;
  }

  // ---------- 화면 전환 ----------
  var lastView = "top";
  function render() { main.innerHTML = viewTop() + viewAll() + viewNear() + viewGuide(); syncNav(); }
  function rerender() { var y = window.scrollY; render(); showView(lastView, true); window.scrollTo(0, y); }
  function setHash() { history.replaceState(null, "", "#" + lastView + qs()); syncNav(); }
  function current() {
    var h = location.hash.slice(1);
    if (/^[AB]\d{2,3}$/.test(h) && byId(h)) return { doc: h };
    var p = parse(h);
    return { view: VIEWS.indexOf(p.view) >= 0 ? p.view : "top", s: p.s };
  }
  function showView(v, keepScroll) {
    lastView = v;
    VIEWS.forEach(function (x) { var el = document.getElementById("v-" + x); if (el) el.classList.toggle("on", x === v); });
    document.querySelectorAll(".nav a").forEach(function (a) { if (a.dataset.v === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (!keepScroll) window.scrollTo(0, 0);
  }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function route() {
    var c = current();
    if (c.doc) {
      if (!document.querySelector(".view.on")) showView("top");
      sbody.innerHTML = detail(byId(c.doc)); sbody.scrollTop = 0;
      if (!sheet.open) { if (sheet.showModal) sheet.showModal(); else sheet.setAttribute("open", ""); }
      return;
    }
    var wasOpen = sheet.open;
    if (wasOpen) closeSheet();
    var keep = wasOpen && c.view === lastView;
    if (!same(c.s, S)) { S = c.s; shown = PAGE; render(); }
    showView(c.view, keep);
  }
  function closeSheet() { if (sheet.close) sheet.close(); else sheet.removeAttribute("open"); }
  function openDoc(id) { if (qTimer) { clearTimeout(qTimer); qTimer = null; setHash(); } pushed = true; location.hash = id; }
  function closeDoc() {
    if (pushed) { pushed = false; history.back(); }
    else { history.replaceState(null, "", "#" + lastView + qs()); route(); }
  }
  function toggle(arr, v) { var i = arr.indexOf(v); if (i < 0) arr.push(v); else arr.splice(i, 1); }
  function refreshAll() {
    var el = document.getElementById("all-list"); if (el) el.innerHTML = allList();
  }
  function pickMe() {
    var prev = S.from;
    if (!navigator.geolocation) { originMsg = "이 브라우저는 위치를 지원하지 않아 " + D.origins[prev === "me" ? "hwagok" : prev].name + " 기준으로 보여요."; rerender(); return; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      me = { lat: pos.coords.latitude, lng: pos.coords.longitude }; S.from = "me"; originMsg = ""; setHash(); rerender();
    }, function () {
      me = null; if (S.from === "me") S.from = "hwagok";
      originMsg = "위치를 쓸 수 없어 " + D.origins[S.from].name + " 기준으로 돌아왔어요."; rerender();
    }, { timeout: 8000, maximumAge: 300000 });
  }

  function refocus(sel) { var el = sel && document.querySelector(sel); if (el) el.focus({ preventScroll: true }); }
  function selOf(el) {
    var ks = ["f", "val", "now", "sort", "from"], s = "";
    ks.forEach(function (k) { if (el.dataset[k] != null) s += "[data-" + k + '="' + el.dataset[k] + '"]'; });
    var v = el.closest(".view"); return s ? "#" + (v ? v.id : "main") + " " + s : null;
  }
  document.addEventListener("click", function (e) {
    var ctl = e.target.closest("[data-f],[data-now],[data-sort],[data-from]");
    var focusSel = ctl && document.activeElement === ctl ? selOf(ctl) : null;
    if (focusSel) setTimeout(function () { refocus(focusSel); }, 0);
    var c = e.target.closest("[data-id]");
    if (c) { e.preventDefault(); openDoc(c.dataset.id); return; }
    var a = e.target.closest('a[href^="#"]');
    if (a && a.getAttribute("href") === location.hash) { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    var f = e.target.closest("[data-f]");
    if (f) { toggle(S[f.dataset.f], f.dataset.val); shown = PAGE; setHash(); rerender(); return; }
    if (e.target.closest("[data-now]")) { S.now = !S.now; shown = PAGE; setHash(); rerender(); return; }
    var s = e.target.closest("[data-sort]");
    if (s) { S.sort = s.dataset.sort; shown = PAGE; setHash(); rerender(); return; }
    var o = e.target.closest("[data-from]");
    if (o) {
      if (o.dataset.from === "me") { pickMe(); return; }
      S.from = o.dataset.from; originMsg = ""; setHash(); rerender(); return;
    }
    if (e.target.closest(".more")) { shown += PAGE; refreshAll(); return; }
    if (e.target.closest("#gorec")) { document.getElementById("rec").scrollIntoView({ behavior: "smooth", block: "start" }); }
  });
  document.addEventListener("input", function (e) {
    if (!e.target.matches("#v-all .search")) return;
    S.q = e.target.value.slice(0, 40); shown = PAGE;
    refreshAll();
    clearTimeout(qTimer); qTimer = setTimeout(function () { qTimer = null; setHash(); }, 250);
  });
  document.getElementById("sx").addEventListener("click", closeDoc);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeDoc(); });
  sheet.addEventListener("cancel", function (e) { e.preventDefault(); closeDoc(); });
  window.addEventListener("hashchange", route);

  fetch("data.json?v=2").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (data) {
    D = data;
    var c = current(); if (c.s) S = c.s;
    render(); route();
    setTimeout(function () { document.documentElement.classList.add("played"); }, 1700);
  }).catch(function () {
    main.innerHTML = '<p class="load">자료를 불러오지 못했어요. 새로고침해 주세요.</p>';
  });
})();
</script>
</body>
</html>
