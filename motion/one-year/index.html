<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리의 1년</title>
<meta name="description" content="1일부터 365일까지 사진으로 되짚고, 마지막에 선물상자를 열면 영상이 나오는 1주년 모션 편지입니다.">
<link rel="canonical" href="https://lab.bkan.dev/motion/one-year/">
<meta property="og:type" content="website">
<meta property="og:title" content="우리의 1년">
<meta property="og:description" content="1일부터 365일까지, 그리고 선물 하나.">
<meta property="og:image" content="https://lab.bkan.dev/motion/one-year/og.jpg?v=1">
<meta property="og:url" content="https://lab.bkan.dev/motion/one-year/">
<meta name="theme-color" content="#120e0f">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="one.css?v=1">
</head>
<body>

<div class="stage" id="stage">

  <!-- 화면 위 일수 카운터 -->
  <div class="counter" id="counter" aria-live="off">
    <i class="dot" id="dot"></i>
    <b class="num" id="num">1</b><span class="unit" id="unit">일</span>
    <small class="date" id="date">2025.10.31</small>
  </div>

  <!-- 처음부터 끝까지 이어지는 하트 -->
  <svg class="heart" id="heart" viewBox="0 0 100 90" aria-hidden="true"><path d="M50 86 C20 64 4 48 4 28 C4 13 15 3 28 3 C38 3 45 9 50 17 C55 9 62 3 72 3 C85 3 96 13 96 28 C96 48 80 64 50 86Z"/></svg>

  <!-- 1일: 전화 -->
  <div class="phone" id="phone" aria-hidden="true">
    <div class="ring-waves"><i></i><i></i><i></i></div>
    <svg class="handset" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
    <p class="call">통화 중</p>
  </div>

  <div class="stack" id="stack"></div>
  <div class="stamps" id="stamps"></div>
  <div class="wall" id="wall" aria-hidden="true"></div>
  <div class="anniv" id="anniv"><b>1주년</b><small>2026.10.31</small></div>

  <!-- 거리 -->
  <div class="dist" id="dist">
    <p class="d-title" id="dTitle">우리의 물리적 거리</p>
    <p class="d-num" id="dNum"><b id="dVal">0</b>km</p>
    <div class="d-map" id="dMap">
      <i class="d-line" id="dLine"></i>
      <i class="d-dot" id="dA"><span>한국</span></i>
      <i class="d-dot" id="dB"><span>미국</span></i>
    </div>
    <p class="d-but" id="dBut">하지만?</p>
    <div class="d-soul" id="dSoul"><p>영혼의 거리</p><b>1nm</b></div>
  </div>

  <div class="says" id="says"></div>

  <!-- 반지 -->
  <div class="ring" id="ring" aria-hidden="true">
    <i class="rays"></i>
    <svg viewBox="0 0 200 220">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff1c2"/><stop offset=".45" stop-color="#f2c45a"/><stop offset="1" stop-color="#b9842a"/>
        </linearGradient>
        <clipPath id="gem"><path d="M64 52 L82 30 L118 30 L136 52 L100 96Z"/></clipPath>
      </defs>
      <ellipse cx="100" cy="148" rx="62" ry="58" fill="none" stroke="url(#gold)" stroke-width="13"/>
      <path d="M84 92 L100 104 L116 92 L112 84 L88 84Z" fill="url(#gold)"/>
      <g class="gem">
        <path d="M64 52 L82 30 L118 30 L136 52 L100 96Z" fill="#dff3ff"/>
        <path d="M64 52 L82 30 L92 52Z" fill="#bfe6ff"/>
        <path d="M92 52 L100 30 L108 52Z" fill="#ffffff"/>
        <path d="M108 52 L118 30 L136 52Z" fill="#a8dcff"/>
        <path d="M64 52 L100 96 L92 52Z" fill="#9fd2f5"/>
        <path d="M92 52 L100 96 L108 52Z" fill="#e9f8ff"/>
        <path d="M108 52 L100 96 L136 52Z" fill="#86c4ee"/>
        <rect class="glint" x="40" y="10" width="18" height="110" fill="#fff" opacity=".9" clip-path="url(#gem)" transform="rotate(20 100 60)"/>
      </g>
    </svg>
    <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
  </div>

  <!-- 선물상자 -->
  <button class="gift" id="gift" type="button" aria-label="선물상자 열기" disabled>
    <i class="burst"></i>
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <rect x="34" y="88" width="132" height="98" rx="8" fill="#e9506f"/>
      <rect x="34" y="88" width="132" height="14" fill="#c93d5c"/>
      <rect x="91" y="88" width="18" height="98" fill="#ffe2a8"/>
      <g id="lid">
        <rect x="26" y="66" width="148" height="28" rx="6" fill="#ff6b8b"/>
        <rect x="91" y="66" width="18" height="28" fill="#ffe2a8"/>
        <path d="M100 66 C80 40 58 44 64 58 C68 66 84 66 100 66Z" fill="#ffd27a"/>
        <path d="M100 66 C120 40 142 44 136 58 C132 66 116 66 100 66Z" fill="#ffd27a"/>
        <circle cx="100" cy="64" r="7" fill="#f2b84b"/>
      </g>
    </svg>
    <span class="bubble">눌러봐</span>
  </button>

  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <!-- 선물 영상 -->
  <div class="reveal" id="reveal">
    <div class="screen"><video id="video" src="gift.mp4" poster="gift-poster.jpg" playsinline preload="metadata"></video>
      <button class="tap-play" id="tapPlay" type="button" hidden>눌러서 재생</button>
    </div>
    <div class="after" id="after" hidden>
      <a class="btn primary" id="save" href="gift.mp4" download="우리의-1주년-선물.mp4">선물 저장하기</a>
      <p class="hint">아이폰은 파일 앱에 저장돼. 파일 앱에서 공유 → 비디오 저장을 누르면 사진첩으로 옮겨져.</p>
      <div class="row">
        <button class="btn" id="again" type="button">영상 다시 보기</button>
        <button class="btn" id="restart" type="button">처음부터</button>
      </div>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div class="start" id="start">
    <p class="kicker">2025.10.31 - 2026.10.31</p>
    <h1>선물이 도착했어</h1>
    <p class="sub">소리 켜고 열어 줘</p>
    <button class="btn primary" id="open" type="button" disabled>포장 푸는 중 <span id="prog">0</span>%</button>
    <p class="credit">Music: Rihanna - Umbrella (ft. JAY-Z)</p>
  </div>

  <button class="mute" id="mute" type="button" aria-label="소리 끄기" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
</div>

<audio id="music" src="umbrella.m4a" preload="auto"></audio>

<script src="data.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="one.js?v=1"></script>
</body>
</html>
