<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리의 1년</title>
<meta name="description" content="1일부터 365일까지 사진으로 되짚고, 마지막에 선물상자를 열면 영상이 나오는 1주년 모션 편지입니다.">
<link rel="canonical" href="https://lab.bkan.dev/motion/one-year/">
<meta property="og:type" content="website">
<meta property="og:title" content="우리의 1년">
<meta property="og:description" content="1일부터 365일까지, 그리고 선물 하나.">
<meta property="og:image" content="https://lab.bkan.dev/motion/one-year/og.jpg?v=1">
<meta property="og:url" content="https://lab.bkan.dev/motion/one-year/">
<meta name="theme-color" content="#FFEFF2">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="one.css?v=3">
</head>
<body>

<div class="stage" id="stage">

  <!-- 바탕색 면과 띠 와이프 -->
  <div class="field" id="field" aria-hidden="true"></div>
  <div class="strips" id="strips" aria-hidden="true"></div>

  <!-- 오프닝: 하트 -> 선 -> 세 줄 -->
  <div class="lines" id="lines" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- 화면 위 일수 카운터(오도미터) -->
  <div class="counter" id="counter" aria-hidden="true">
    <span class="odo" id="odo"></span><span class="unit">일</span>
    <small class="date" id="date">2025.10.31</small>
  </div>

  <!-- 1일: 막대가 전화기가 된다 -->
  <div class="phone" id="phone" aria-hidden="true">
    <div class="ring-waves"><i></i><i></i><i></i></div>
    <svg class="handset" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
    <p class="call">통화 중</p>
  </div>

  <div class="stack" id="stack"></div>
  <div class="stamps" id="stamps"></div>

  <!-- 1주년: 우리 1년 데이터(달마다 사진 수) -->
  <svg class="chart" id="chart" aria-hidden="true"></svg>
  <div class="wall" id="wall" aria-hidden="true"></div>

  <!-- 거리 -->
  <div class="dist" id="dist">
    <div class="d-map" id="dMap">
      <div class="d-line" id="dLine"></div>
      <i class="d-dot" id="dA"><span>한국</span></i>
      <i class="d-dot" id="dB"><span>미국</span></i>
    </div>
  </div>

  <div class="says" id="says"></div>

  <!-- 처음부터 끝까지 이어지는 하트 -->
  <svg class="heart" id="heart" viewBox="0 0 100 90" aria-hidden="true"><path d="M50 86 C20 64 4 48 4 28 C4 13 15 3 28 3 C38 3 45 9 50 17 C55 9 62 3 72 3 C85 3 96 13 96 28 C96 48 80 64 50 86Z"/></svg>

  <!-- 반지: 평면 원이 기울어 입체가 된다 -->
  <div class="ring" id="ring" aria-hidden="true">
    <svg viewBox="0 0 200 220">
      <ellipse class="band-back" cx="100" cy="150" rx="66" ry="66" fill="none" stroke="#d9a441" stroke-width="12"/>
      <ellipse class="band" cx="100" cy="150" rx="66" ry="66" fill="none" stroke="#f2c45a" stroke-width="12" stroke-dasharray="0 1000"/>
      <g class="gem">
        <path d="M84 88 L100 100 L116 88 L112 80 L88 80Z" fill="#f2c45a"/>
        <path d="M64 50 L82 28 L118 28 L136 50 L100 94Z" fill="#e6f6ff"/>
        <path d="M64 50 L82 28 L92 50Z" fill="#c4e8ff"/>
        <path d="M92 50 L100 28 L108 50Z" fill="#ffffff"/>
        <path d="M108 50 L118 28 L136 50Z" fill="#b3e0ff"/>
        <path d="M64 50 L100 94 L92 50Z" fill="#a8d6f5"/>
        <path d="M92 50 L100 94 L108 50Z" fill="#f2fbff"/>
        <path d="M108 50 L100 94 L136 50Z" fill="#8fc8ee"/>
      </g>
    </svg>
    <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
  </div>

  <!-- 선물상자 -->
  <button class="gift" id="gift" type="button" aria-label="선물상자 열기" disabled>
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <rect x="44" y="98" width="132" height="98" rx="10" fill="#2B0F1E"/>
      <rect x="34" y="88" width="132" height="98" rx="10" fill="#8F7BFF"/>
      <rect x="91" y="88" width="18" height="98" fill="#FF4D7E"/>
      <g id="lid">
        <rect x="26" y="64" width="148" height="30" rx="8" fill="#a594ff"/>
        <rect x="91" y="64" width="18" height="30" fill="#FF4D7E"/>
        <path d="M100 64 C80 36 56 42 63 57 C67 65 84 64 100 64Z" fill="#FF4D7E"/>
        <path d="M100 64 C120 36 144 42 137 57 C133 65 116 64 100 64Z" fill="#FF4D7E"/>
        <circle cx="100" cy="62" r="7" fill="#d93a66"/>
      </g>
    </svg>
    <span class="bubble">눌러봐</span>
  </button>

  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <!-- 선물 영상 -->
  <div class="reveal" id="reveal">
    <div class="screen"><video id="video" src="gift-hf.mp4" poster="gift-hf-poster.jpg" playsinline preload="metadata"></video>
      <button class="tap-play" id="tapPlay" type="button" hidden>눌러서 재생</button>
    </div>
    <div class="after" id="after" hidden>
      <a class="btn primary" id="save" href="gift-hf.mp4" download="우리의-1주년-선물.mp4">선물 저장하기</a>
      <p class="hint">아이폰은 파일 앱에 저장돼. 파일 앱에서 공유 → 비디오 저장을 누르면 사진첩으로 옮겨져.</p>
      <div class="row">
        <button class="btn" id="again" type="button">영상 다시 보기</button>
        <button class="btn" id="restart" type="button">처음부터</button>
      </div>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div class="start" id="start">
    <p class="kicker">2025.10.31 - 2026.10.31</p>
    <h1>선물이 도착했어</h1>
    <p class="sub">소리 켜고 열어 줘</p>
    <button class="btn primary" id="open" type="button" disabled>포장 푸는 중 <span id="prog">0</span>%</button>
    <p class="credit">Music: Rihanna - Umbrella (ft. JAY-Z)</p>
  </div>

  <button class="mute" id="mute" type="button" aria-label="소리 끄기" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
</div>

<audio id="music" src="umbrella.mp3" preload="auto"></audio>

<script src="data.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="one.js?v=3"></script>
</body>
</html>
